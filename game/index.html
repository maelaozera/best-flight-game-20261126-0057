<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sky Courier — Coral Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a2a44; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: -9999px; top: -9999px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sky Courier Coral Run: fly a prop plane through coral rings over an island archipelago and land on the runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="selftest"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
